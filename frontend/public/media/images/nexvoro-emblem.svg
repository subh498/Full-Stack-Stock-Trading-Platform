<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <linearGradient id="emblemBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="emblemRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="rgba(14, 165, 233, 0.1)" />
      <stop offset="100%" stop-color="rgba(6, 182, 212, 0.6)" />
    </linearGradient>
    <filter id="emblemGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Glow Ring -->
  <circle cx="160" cy="160" r="145" stroke="url(#emblemRing)" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="8 6" />
  <circle cx="160" cy="160" r="135" stroke="url(#emblemRing)" stroke-width="3" filter="url(#emblemGlow)" stroke-opacity="0.8" />

  <!-- Hexagonal Tech Shield Background -->
  <polygon points="160,35 265,95 265,225 160,285 55,225 55,95" fill="url(#emblemBg)" stroke="url(#emblemRing)" stroke-width="2.5" />

  <!-- Internal Grid Lines -->
  <line x1="85" y1="120" x2="235" y2="120" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="85" y1="160" x2="235" y2="160" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="85" y1="200" x2="235" y2="200" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Algorithmic Chart Wave -->
  <path d="M 85 210 Q 115 170, 135 185 T 180 135 T 235 105 L 235 220 L 85 220 Z" fill="url(#chartGrad)" />
  <path d="M 85 210 Q 115 170, 135 185 T 180 135 T 235 105" stroke="#38bdf8" stroke-width="3" fill="none" filter="url(#emblemGlow)" />

  <!-- Central Dynamic N-Mark -->
  <g transform="translate(130, 115) scale(1.6)">
    <path d="M4 25 L4 8 L9 8 L9 25 Z" fill="#ffffff" />
    <path d="M8 8 L24 23 L24 25 L19 25 L4 10 Z" fill="#38bdf8" />
    <path d="M20 25 L20 8 L25 8 L25 25 Z" fill="#ffffff" />
    <circle cx="14" cy="16" r="2" fill="#06b6d4" />
  </g>

  <!-- Node Bullets on Chart -->
  <circle cx="85" cy="210" r="4" fill="#38bdf8" />
  <circle cx="135" cy="185" r="4" fill="#38bdf8" />
  <circle cx="180" cy="135" r="4" fill="#38bdf8" />
  <circle cx="235" cy="105" r="5" fill="#22c55e" filter="url(#emblemGlow)" />

  <!-- Tech Corner Markers -->
  <circle cx="160" cy="48" r="3" fill="#38bdf8" />
  <circle cx="160" cy="272" r="3" fill="#38bdf8" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 50" fill="none">
  <defs>
    <linearGradient id="nexvoroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="nexvoroAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagonal / Dynamic N Icon -->
  <g transform="translate(6, 5)">
    <!-- Left Pillar -->
    <path d="M4 35 L4 11 C4 8.5 6 6.5 8.5 6.5 L12 6.5 L12 35 Z" fill="url(#nexvoroGrad)" />
    <!-- Diagonal Dynamic Slash -->
    <path d="M10 8 L32 32 C33.5 33.5 35 32 35 29.5 L35 8 L30 8 L10 29.5 Z" fill="url(#nexvoroAccent)" />
    <!-- Right Pillar -->
    <path d="M28 35 L28 11 L33 6.5 L34 6.5 C36.5 6.5 38.5 8.5 38.5 11 L38.5 35 Z" fill="url(#nexvoroGrad)" />
    <!-- Tech Accent Dots -->
    <circle cx="21" cy="20" r="2.5" fill="#38bdf8" filter="url(#glow)" />
  </g>

  <!-- Typography: NEXVORO -->
  <text x="56" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="24" font-weight="900" letter-spacing="2.5" fill="currentColor">
    NEX<tspan fill="url(#nexvoroGrad)">VORO</tspan>
  </text>
  
  <!-- Subtle Tagline/Dot -->
  <circle cx="225" cy="18" r="3" fill="url(#nexvoroAccent)" filter="url(#glow)" />
</svg>